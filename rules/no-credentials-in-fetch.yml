id: no-credentials-in-fetch
language: rust
severity: error
message: Page fetching must never see Cloudflare credentials or attach secrets to a request.
note: |
  `ws fetch` requests arbitrary hosts and follows redirects, so the fetch,
  body and markdown modules must stay credential-free: no `Credentials`, no
  API token, no Authorization or Cookie header. Only the Cloudflare clients
  (src/client.rs for search, src/render.rs for `--render`) may hold the token,
  and they never follow redirects.
files:
  - src/fetch.rs
  - src/markdown.rs
  - src/body.rs
rule:
  any:
    - regex: ^Credentials$
      any:
        - kind: identifier
        - kind: type_identifier
    - pattern: ENV_API_TOKEN
    - pattern: $A.token
    - kind: string_literal
      regex: (?i)authorization|cookie
