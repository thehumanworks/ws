[package]
name = "ws"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Web search from the terminal via Cloudflare's AI Gateway Web Search API"
readme = "README.md"
publish = false

[lib]
name = "ws"
path = "src/lib.rs"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2.2"
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Strict by design: these lints steer contributors (human or agent) towards
# explicit error handling, injected I/O and documented public items.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_results = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow" # transitive; not actionable here
# Selected restriction lints.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
wildcard_enum_match_arm = "deny"
clone_on_ref_ptr = "deny"
str_to_string = "deny"
unneeded_field_pattern = "deny"
rest_pat_in_fully_bound_structs = "deny"
