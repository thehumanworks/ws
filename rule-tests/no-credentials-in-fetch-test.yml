id: no-credentials-in-fetch
valid:
  - 'let response = self.agent.get(url).header("Accept", accept).call()?;'
  - 'let content_type = response.headers().get("content-type");'
invalid:
  - 'use crate::config::Credentials;'
  - 'fn get(&self, credentials: &Credentials, url: &str) {}'
  - 'let request = self.agent.get(url).header("Authorization", value);'
  - 'let request = self.agent.get(url).header("cookie", jar);'
  - 'let secret = settings.credentials.token;'
  - 'let token = env(ENV_API_TOKEN);'
