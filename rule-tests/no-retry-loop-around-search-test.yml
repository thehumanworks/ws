id: no-retry-loop-around-search
valid:
  - let outcome = client.search(&credentials, &request)?;
  - for item in items { render(item); }
invalid:
  - loop { if let Ok(o) = client.search(&c, &r) { break; } }
  - for attempt in 0..3 { let _ = client.search(&c, &r); }
  - while tries < 3 { result = client.search(&c, &r); }
